<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <style>
      .box { fill:#ffffff; stroke:#334155; stroke-width:1.5; rx:10; }
      .svc { fill:#eff6ff; stroke:#1d4ed8; stroke-width:1.5; rx:10; }
      .store { fill:#fefce8; stroke:#a16207; stroke-width:1.5; rx:10; }
      .ml { fill:#f0fdf4; stroke:#15803d; stroke-width:1.5; rx:10; }
      .ops { fill:#faf5ff; stroke:#7e22ce; stroke-width:1.5; rx:10; }
      .title { font-weight:600; font-size:14px; fill:#0f172a; }
      .sub { fill:#475569; font-size:12px; }
      .edge { stroke:#475569; stroke-width:1.6; fill:none; marker-end:url(#arrow); }
      .edge-red { stroke:#dc2626; stroke-width:1.6; fill:none; marker-end:url(#arrow-red); }
      .edge-green { stroke:#16a34a; stroke-width:1.6; fill:none; marker-end:url(#arrow-green); stroke-dasharray:6 4; }
      .lbl { fill:#334155; font-size:11.5px; }
      .zone { fill:none; stroke:#cbd5e1; stroke-dasharray:4 4; rx:14; }
      .zlbl { fill:#64748b; font-size:12px; font-weight:600; letter-spacing:.04em; }
    </style>
  </defs>

  <rect width="1180" height="640" fill="#f8fafc"/>
  <text x="24" y="34" font-size="20" font-weight="700" fill="#0f172a">FraudStream — real-time transaction fraud scoring</text>
  <text x="24" y="54" class="sub">Replay → queue → XGBoost scorer → alerts → owner feedback → retraining, with drift monitoring throughout</text>

  <!-- zones -->
  <rect x="24" y="80" width="300" height="190" class="zone"/>
  <text x="36" y="98" class="zlbl">INGEST</text>
  <rect x="24" y="290" width="300" height="320" class="zone"/>
  <text x="36" y="308" class="zlbl">TRAINING (CPU or RAPIDS GPU)</text>
  <rect x="344" y="80" width="520" height="530" class="zone"/>
  <text x="356" y="98" class="zlbl">SCORING SERVICE  (Docker · ECS Fargate)</text>
  <rect x="884" y="80" width="272" height="530" class="zone"/>
  <text x="896" y="98" class="zlbl">OWNER &amp; OPERATIONS</text>

  <!-- ingest -->
  <rect x="44" y="112" width="260" height="56" class="box"/>
  <text x="60" y="134" class="title">Dataset (Kaggle / OpenML creditcard.csv)</text>
  <text x="60" y="152" class="sub">284,807 tx · 492 fraud · Time, V1–V28, Amount</text>

  <rect x="44" y="196" width="260" height="56" class="svc"/>
  <text x="60" y="218" class="title">Replay producer</text>
  <text x="60" y="236" class="sub">fraudstream.replay · paces by Time ×speed or --rate</text>
  <path d="M174,168 L174,196" class="edge"/>

  <!-- queue -->
  <rect x="364" y="196" width="200" height="56" class="store"/>
  <text x="380" y="218" class="title">Queue: Redis Streams</text>
  <text x="380" y="236" class="sub">or Kafka · topic transactions</text>
  <path d="M304,224 L364,224" class="edge"/>
  <text x="310" y="214" class="lbl">publish</text>

  <!-- consumer / scorer -->
  <rect x="364" y="300" width="200" height="86" class="svc"/>
  <text x="380" y="322" class="title">Scoring consumer</text>
  <text x="380" y="340" class="sub">consumer group "scorer"</text>
  <text x="380" y="356" class="sub">scale horizontally · XACK after</text>
  <text x="380" y="372" class="sub">scoring (at-least-once)</text>
  <path d="M464,252 L464,300" class="edge"/>
  <text x="472" y="280" class="lbl">XREADGROUP</text>

  <rect x="604" y="300" width="240" height="86" class="ml"/>
  <text x="620" y="322" class="title">XGBoost model (fraud_xgb.json)</text>
  <text x="620" y="340" class="sub">31 features · inplace_predict ≈ 0.1 ms</text>
  <text x="620" y="356" class="sub">threshold tuned on validation F1</text>
  <text x="620" y="372" class="sub">+ meta: reference histograms for PSI</text>
  <path d="M564,343 L604,343" class="edge"/>

  <rect x="364" y="420" width="200" height="70" class="svc"/>
  <text x="380" y="442" class="title">FastAPI  /score</text>
  <text x="380" y="460" class="sub">sync path, p99 &lt; 100 ms</text>
  <text x="380" y="476" class="sub">/alerts · /feedback · /drift · /metrics</text>
  <path d="M484,386 L484,420" class="edge"/>
  <path d="M564,455 L604,455 L604,386" class="edge"/>
  <text x="572" y="446" class="lbl">same pipeline</text>

  <rect x="604" y="420" width="240" height="70" class="ops"/>
  <text x="620" y="442" class="title">Drift monitor (PSI)</text>
  <text x="620" y="460" class="sub">sliding window vs training histograms</text>
  <text x="620" y="476" class="sub">ok &lt; 0.1 · warn &lt; 0.2 · drift ≥ 0.2</text>

  <rect x="364" y="524" width="200" height="56" class="store"/>
  <text x="380" y="546" class="title">Alert store</text>
  <text x="380" y="564" class="sub">SQLite (dev) · Postgres (prod)</text>
  <path d="M464,490 L464,524" class="edge-red"/>
  <text x="472" y="510" class="lbl">score ≥ threshold</text>

  <rect x="604" y="524" width="240" height="56" class="store"/>
  <text x="620" y="546" class="title">Alert topic (Redis/Kafka)</text>
  <text x="620" y="564" class="sub">fan-out to every API replica → SSE</text>
  <path d="M564,552 L604,552" class="edge-red"/>

  <!-- owner side -->
  <rect x="904" y="112" width="232" height="86" class="svc"/>
  <text x="920" y="134" class="title">React dashboard</text>
  <text x="920" y="152" class="sub">live alerts over Server-Sent Events</text>
  <text x="920" y="168" class="sub">"Real fraud" / "False alarm" buttons</text>
  <text x="920" y="184" class="sub">stats · latency · drift panel</text>
  <path d="M844,552 L870,552 L870,155 L904,155" class="edge-red"/>
  <text x="852" y="540" class="lbl">SSE</text>

  <rect x="904" y="232" width="232" height="56" class="box"/>
  <text x="920" y="254" class="title">Business owner</text>
  <text x="920" y="272" class="sub">reviews each alert, labels it</text>
  <path d="M1020,198 L1020,232" class="edge"/>

  <!-- feedback loop -->
  <path d="M904,260 L880,260 L880,600 L464,600 L464,580" class="edge-green"/>
  <text x="560" y="594" class="lbl" fill="#15803d">POST /alerts/{id}/feedback → labelled row (Class = fraud ? 1 : 0)</text>

  <rect x="904" y="322" width="232" height="70" class="ops"/>
  <text x="920" y="344" class="title">Prometheus</text>
  <text x="920" y="362" class="sub">scrapes /metrics: latency histograms,</text>
  <text x="920" y="378" class="sub">alert counters, drift PSI gauges</text>
  <path d="M844,470 L870,470 L870,357 L904,357" class="edge"/>

  <rect x="904" y="426" width="232" height="70" class="ops"/>
  <text x="920" y="448" class="title">GitHub Actions</text>
  <text x="920" y="466" class="sub">ci.yml: ruff · pytest · tsc · docker build</text>
  <text x="920" y="482" class="sub">deploy.yml: OIDC → ECR → ECS (Terraform)</text>

  <rect x="904" y="520" width="232" height="70" class="box"/>
  <text x="920" y="542" class="title">AWS</text>
  <text x="920" y="560" class="sub">ECS Fargate · ElastiCache Redis · RDS</text>
  <text x="920" y="576" class="sub">ALB · ECR · CloudWatch</text>

  <!-- training -->
  <rect x="44" y="330" width="260" height="70" class="ml"/>
  <text x="60" y="352" class="title">ml/train.py</text>
  <text x="60" y="370" class="sub">chronological split · early stopping</text>
  <text x="60" y="386" class="sub">--device cpu | cuda (RAPIDS cuDF + XGBoost)</text>
  <path d="M174,168 L174,180 L30,180 L30,365 L44,365" class="edge" stroke-dasharray="3 3"/>

  <rect x="44" y="424" width="260" height="56" class="ml"/>
  <text x="60" y="446" class="title">ml/retrain.py</text>
  <text x="60" y="464" class="sub">pulls /labels/export.csv, up-weights feedback ×5</text>
  <path d="M174,480 L174,424" class="edge-green"/>
  <path d="M364,552 L340,552 L340,520 L174,520 L174,480" class="edge-green"/>
  <text x="186" y="514" class="lbl" fill="#15803d">GET /labels/export.csv</text>

  <rect x="44" y="508" width="260" height="0" fill="none"/>
  <rect x="44" y="540" width="260" height="56" class="ml"/>
  <text x="60" y="562" class="title">ml/benchmark_gpu.py</text>
  <text x="60" y="580" class="sub">CPU vs GPU fit time → docs/benchmark.json</text>

  <path d="M304,365 L334,365 L334,343 L604,343" class="edge" stroke-dasharray="3 3"/>
  <text x="200" y="326" class="lbl">writes models/fraud_xgb.json → mounted into the service</text>
</svg>

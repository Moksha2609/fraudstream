server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Optional HTTP basic auth for the whole dashboard (set DASHBOARD_PASSWORD).
    include /etc/nginx/auth.conf;

    # Unauthenticated liveness endpoint for container and load-balancer checks.
    location = /healthz {
        auth_basic off;
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # API: strip the /api prefix and forward to the FastAPI service.
    # Buffering is disabled so Server-Sent Events (/api/alerts/stream) flow through.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
    }

    # Hashed build assets can be cached aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}

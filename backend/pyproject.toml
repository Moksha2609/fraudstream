[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudstream"
version = "0.1.0"
description = "Real-time transaction fraud scoring: stream replay, queue, XGBoost scorer, FastAPI, drift monitoring"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "xgboost>=2.1",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",
    "redis>=5.0",
    "aiokafka>=0.11",
    "sqlalchemy>=2.0",
    "prometheus-client>=0.20",
    "orjson>=3.10",
    "httpx>=0.27",
    "sse-starlette>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "fakeredis>=2.23", "ruff>=0.5", "pytest-cov>=5"]
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
fraudstream-api = "fraudstream.api:main"
fraudstream-consumer = "fraudstream.consumer:main"
fraudstream-replay = "fraudstream.replay:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["fraudstream*", "ml*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["redis: needs a real Redis server (set FS_REDIS_URL)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
